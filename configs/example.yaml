refresh:
  interface: 250ms
  ping: 1s
  connections: 2s
  routes: 10s
targets:
  - name: Cloudflare
    address: 1.1.1.1
  - name: Google
    address: 8.8.8.8
  - name: Home Router
    address: 192.168.4.1
    port: 80
graph:
  history: 5m
alerts:
  latency_ms: 150
  packet_loss_pct: 5
  jitter_ms: 30
  bandwidth_drop_pct: 50
  webhook: ""
  log_file: ""
dns:
  resolvers:
    - 1.1.1.1
    - 8.8.8.8
    - 9.9.9.9
ping:
  method: auto
  port: 443
  timeout: 1s